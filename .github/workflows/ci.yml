# CI for fif-ears.
# Test command from README.md, "Tests and verification":
#   python -m unittest discover -s tests -v
# Dependencies from pyproject.toml (numpy, scipy), installed via the
# package itself. The audio loader in ears/audio.py probes files with
# the ffprobe binary, so the workflow installs ffmpeg as a system
# dependency. Added under the November 2026 audit follow-through:
# the suite existed and passed locally but had no CI.
name: CI
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ffmpeg (the suite probes audio with ffprobe)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Install package
        run: pip install -e .
      - name: Run tests
        run: python -m unittest discover -s tests -v
