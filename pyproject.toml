[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "fif-ears"
version = "0.1.0"
description = "Audio perception for agents: translate an audio file into a structured report and an AI-readable narrative."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
]

[project.scripts]
ears = "ears.cli:main"

[tool.setuptools.packages.find]
include = ["ears*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
